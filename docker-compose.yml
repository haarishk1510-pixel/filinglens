# Runs the API and website. Ollama stays on the host for Apple GPU access.
services:
  api:
    build: ./backend
    ports: ["8000:8000"]
    env_file: ./backend/.env
    environment:
      LOCAL_LLM_BASE_URL: http://host.docker.internal:11434/v1
      FILINGLENS_DATA_DIR: /data
    volumes:
      - ./data:/data
  web:
    build: ./frontend
    ports: ["3000:3000"]
    depends_on: [api]
